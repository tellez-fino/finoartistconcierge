<title>FINO Comparador de Vuelos</title>
<style>
:root{--bg:#F7F6F2;--panel:#fff;--ink:#131313;--mute:#8A8A83;--line:#DEDDD6;--accent:#1848C8;--input:#FFFBE6;--bad:#B3261E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141413;--panel:#1E1E1C;--ink:#F1F0EA;--mute:#8C8B84;--line:#33332F;--accent:#7A9BFF;--input:#2C2A1E;--bad:#F2A19B}}
:root[data-theme="dark"]{--bg:#141413;--panel:#1E1E1C;--ink:#F1F0EA;--mute:#8C8B84;--line:#33332F;--accent:#7A9BFF;--input:#2C2A1E;--bad:#F2A19B}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;min-height:100vh;display:grid;place-items:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:32px 30px;width:min(380px,92vw);box-shadow:0 6px 24px rgba(0,0,0,.08);text-align:center}
.card img{width:110px;margin-bottom:6px}
.card small{display:block;color:var(--mute);font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:22px}
input{font:inherit;color:var(--ink);background:var(--input);border:1px solid var(--line);border-radius:9px;padding:11px 12px;width:100%;box-sizing:border-box;text-align:center;letter-spacing:.2em;font-size:16px}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button{margin-top:12px;width:100%;font:600 14px/1 inherit;border:0;background:var(--ink);color:var(--bg);padding:12px;border-radius:9px;cursor:pointer}
button:disabled{opacity:.5}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:10px}
.foot{color:var(--mute);font-size:11.5px;margin-top:18px}
</style>

async function open(pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(D.s),iterations:D.n,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(D.i)},k,u8(D.c));

  try{sessionStorage.setItem("fino_cmp_pw",pw)}catch(_){}
  document.open();document.write(html);document.close();
}
